    <script>
        // ==============================================
        // AGENDA ORGANIZACIONAL PWA - APLICAÇÃO COMPLETA
        // ==============================================

        'use strict';

        class AgendaApp {
            constructor() {
                this.state = {
                    currentDate: new Date(),
                    selectedDate: new Date(),
                    entries: new Map(),
                    tags: new Set(),
                    settings: this.loadSettings(),
                    isOnline: navigator.onLine,
                    db: null,
                    editorContent: '',
                    ui: {
                        sidebarOpen: true,
                        backupPanelOpen: true,
                        theme: 'light'
                    }
                };

                this.elements = {};
                this.deferredPrompt = null;
                this.init();
            }

            async init() {
                console.log('🚀 Inicializando Agenda Organizacional PWA...');
                
                try {
                    this.cacheElements();
                    await this.initDatabase();
                    await this.loadAllData();
                    this.setupUI();
                    this.setupEvents();
                    await this.setupServiceWorker();
                    this.setupPWAInstall();
                    
                    console.log('✅ Aplicação inicializada com sucesso!');
                    this.showToast('Agenda carregada com sucesso!', 'success');
                    
                } catch (error) {
                    console.error('❌ Erro ao inicializar aplicação:', error);
                    this.showToast('Erro ao carregar agenda', 'error');
                }
            }

            cacheElements() {
                const ids = [
                    'menuToggle', 'currentDate', 'themeToggle', 'searchBtn',
                    'sidebar', 'calendarGrid', 'currentMonth', 'prevMonth',
                    'nextMonth', 'todayBtn', 'newEntry', 'recentDaysList',
                    'selectedDate', 'richEditor', 'saveEntry', 'exportPDF',
                    'backupNow', 'tagsContainer', 'attachmentsContainer',
                    'attachmentsGrid', 'checklistContainer', 'checklistItems',
                    'newChecklistItem', 'addChecklistItemBtn', 'addChecklistBtn',
                    'addTagBtn', 'attachFileBtn', 'exportJSON', 'exportCSV',
                    'importData', 'backupHistory', 'storageProgress', 'storageText',
                    'autoBackup', 'notifications', 'pdfQuality', 'searchModal',
                    'searchInput', 'searchResults', 'toastContainer', 'installPrompt',
                    'installBtn', 'dismissInstall', 'fileInput'
                ];
                
                ids.forEach(id => {
                    this.elements[id] = document.getElementById(id);
                });
            }

            async initDatabase() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('AgendaPWA', 1);
                    
                    request.onerror = () => reject(request.error);
                    
                    request.onsuccess = () => {
                        this.state.db = request.result;
                        console.log('📊 Banco de dados inicializado');
                        resolve();
                    };
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        
                        if (!db.objectStoreNames.contains('entries')) {
                            const store = db.createObjectStore('entries', { keyPath: 'id' });
                            store.createIndex('date', 'date');
                            store.createIndex('tags', 'tags', { multiEntry: true });
                        }
                        
                        if (!db.objectStoreNames.contains('files')) {
                            const store = db.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('date', 'date');
                        }
                        
                        if (!db.objectStoreNames.contains('backups')) {
                            const store = db.createObjectStore('backups', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('date', 'date');
                        }
                        
                        console.log('🔄 Estrutura do banco de dados criada');
                    };
                });
            }

            async loadAllData() {
                const startDate = new Date();
                startDate.setDate(1);
                startDate.setMonth(startDate.getMonth() - 1);
                
                const endDate = new Date();
                endDate.setMonth(endDate.getMonth() + 1);
                endDate.setDate(0);
                
                const entries = await this.getEntriesByDateRange(startDate, endDate);
                entries.forEach(entry => {
                    this.state.entries.set(entry.id, entry);
                    if (entry.tags) {
                        entry.tags.forEach(tag => this.state.tags.add(tag));
                    }
                });
                
                console.log(`📚 ${entries.length} entradas carregadas`);
            }

            setupUI() {
                this.applyTheme(this.state.settings.theme || 'light');
                this.updateCurrentDate();
                this.renderCalendar();
                this.loadRecentDays();
                this.loadTodayEntry();
                this.updateStorageInfo();
                
                if (this.elements.richEditor) {
                    this.elements.richEditor.setAttribute('placeholder',
                        'Comece a escrever suas anotações para hoje...\n\n• Use #tags para organizar\n• Clique em ✓ para checklist\n• Anexe arquivos com 📎');
                }
            }

            setupEvents() {
                // Navegação do calendário
                this.elements.prevMonth?.addEventListener('click', () => this.navigateMonth(-1));
                this.elements.nextMonth?.addEventListener('click', () => this.navigateMonth(1));
                this.elements.todayBtn?.addEventListener('click', () => this.goToToday());
                this.elements.newEntry?.addEventListener('click', () => this.createNewEntry());
                
                // Editor
                this.elements.selectedDate?.addEventListener('change', (e) => {
                    this.selectDate(new Date(e.target.value));
                });
                
                this.elements.saveEntry?.addEventListener('click', () => this.saveCurrentEntry());
                this.elements.exportPDF?.addEventListener('click', () => this.exportToPDF());
                this.elements.backupNow?.addEventListener('click', () => this.createBackup());
                
                // Checklist
                this.elements.newChecklistItem?.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addChecklistItem();
                });
                
                this.elements.addChecklistItemBtn?.addEventListener('click', () => this.addChecklistItem());
                this.elements.addChecklistBtn?.addEventListener('click', () => this.showAddChecklistDialog());
                
                // Tags e Anexos
                this.elements.addTagBtn?.addEventListener('click', () => this.showAddTagDialog());
                this.elements.attachFileBtn?.addEventListener('click', () => this.attachFile());
                this.elements.fileInput?.addEventListener('change', (e) => this.handleFileUpload(e.target.files));
                
                // Backup
                this.elements.exportJSON?.addEventListener('click', () => this.exportToJSON());
                this.elements.exportCSV?.addEventListener('click', () => this.exportToCSV());
                this.elements.importData?.addEventListener('click', () => this.importData());
                
                // Configurações
                this.elements.autoBackup?.addEventListener('change', (e) => {
                    this.state.settings.autoBackup = e.target.checked;
                    this.saveSettings();
                });
                
                this.elements.notifications?.addEventListener('change', (e) => {
                    this.state.settings.notifications = e.target.checked;
                    this.saveSettings();
                });
                
                this.elements.pdfQuality?.addEventListener('change', (e) => {
                    this.state.settings.pdfQuality = e.target.value;
                    this.saveSettings();
                });
                
                // Tema
                this.elements.themeToggle?.addEventListener('click', () => {
                    const newTheme = this.state.ui.theme === 'light' ? 'dark' : 'light';
                    this.applyTheme(newTheme);
                });
                
                // Busca
                this.elements.searchBtn?.addEventListener('click', () => this.openSearch());
                
                // Menu
                this.elements.menuToggle?.addEventListener('click', () => this.toggleSidebar());
                
                // Auto-save
                let autoSaveTimeout;
                this.elements.richEditor?.addEventListener('input', () => {
                    clearTimeout(autoSaveTimeout);
                    autoSaveTimeout = setTimeout(() => this.autoSave(), 3000);
                });
                
                // Eventos globais
                window.addEventListener('online', () => {
                    this.state.isOnline = true;
                    this.showToast('Conectado à internet', 'success');
                });
                
                window.addEventListener('offline', () => {
                    this.state.isOnline = false;
                    this.showToast('Modo offline ativado', 'warning');
                });
            }

            // ========== FUNÇÕES DO CALENDÁRIO ==========
            renderCalendar() {
                const year = this.state.currentDate.getFullYear();
                const month = this.state.currentDate.getMonth();
                
                const monthNames = [
                    'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                    'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
                ];
                
                if (this.elements.currentMonth) {
                    this.elements.currentMonth.textContent = `${monthNames[month]} ${year}`;
                }
                
                if (!this.elements.calendarGrid) return;
                
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDay = firstDay.getDay();
                
                this.elements.calendarGrid.innerHTML = '';
                
                // Cabeçalhos dos dias
                const weekdays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                weekdays.forEach(day => {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'calendar-weekday';
                    dayElement.textContent = day;
                    this.elements.calendarGrid.appendChild(dayElement);
                });
                
                // Espaços vazios
                for (let i = 0; i < startingDay; i++) {
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'calendar-day empty';
                    this.elements.calendarGrid.appendChild(emptyDay);
                }
                
                // Dias do mês
                const today = new Date();
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month, day);
                    const dateKey = this.formatDateKey(date);
                    const dayElement = document.createElement('div');
                    dayElement.className = 'calendar-day';
                    dayElement.textContent = day;
                    dayElement.dataset.date = dateKey;
                    
                    // Verificar se é hoje
                    if (date.getDate() === today.getDate() &&
                        date.getMonth() === today.getMonth() &&
                        date.getFullYear() === today.getFullYear()) {
                        dayElement.classList.add('today');
                    }
                    
                    // Verificar se está selecionado
                    if (this.isSameDay(date, this.state.selectedDate)) {
                        dayElement.classList.add('selected');
                    }
                    
                    // Verificar se tem entradas
                    if (this.hasEntriesForDate(dateKey)) {
                        dayElement.classList.add('has-entries');
                    }
                    
                    dayElement.addEventListener('click', () => {
                        this.selectDate(date);
                    });
                    
                    this.elements.calendarGrid.appendChild(dayElement);
                }
            }

            navigateMonth(direction) {
                const newDate = new Date(this.state.currentDate);
                newDate.setMonth(newDate.getMonth() + direction);
                this.state.currentDate = newDate;
                this.renderCalendar();
                this.loadRecentDays();
            }

            // ========== FUNÇÕES DE DATA ==========
            selectDate(date) {
                this.state.selectedDate = date;
                
                if (this.elements.selectedDate) {
                    const yyyy = date.getFullYear();
                    const mm = String(date.getMonth() + 1).padStart(2, '0');
                    const dd = String(date.getDate()).padStart(2, '0');
                    this.elements.selectedDate.value = `${yyyy}-${mm}-${dd}`;
                }
                
                this.updateCurrentDate();
                this.renderCalendar();
                this.loadEntryForDate(date);
            }

            goToToday() {
                const today = new Date();
                this.state.currentDate = today;
                this.selectDate(today);
                this.showToast('Indo para hoje', 'info');
            }

            createNewEntry() {
                if (this.elements.richEditor) {
                    this.elements.richEditor.innerHTML = '';
                    this.showToast('Nova entrada criada', 'info');
                }
            }

            updateCurrentDate() {
                if (!this.elements.currentDate) return;
                
                const options = {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                };
                
                const dateStr = this.state.selectedDate.toLocaleDateString('pt-BR', options);
                this.elements.currentDate.textContent = dateStr;
            }

            loadRecentDays() {
                if (!this.elements.recentDaysList) return;
                
                const recentDays = [];
                const today = new Date();
                
                for (let i = 0; i < 5; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() - i);
                    recentDays.push({
                        date,
                        formatted: date.toLocaleDateString('pt-BR'),
                        dayName: this.getDayName(date.getDay()),
                        hasEntries: this.hasEntriesForDate(this.formatDateKey(date)),
                        isToday: i === 0
                    });
                }
                
                let html = '';
                recentDays.forEach(dayInfo => {
                    html += `
                        <div class="recent-day ${dayInfo.isToday ? 'today' : ''} ${dayInfo.hasEntries ? 'has-entries' : ''}" 
                             data-date="${this.formatDateKey(dayInfo.date)}">
                            <span class="day-name">${dayInfo.dayName}</span>
                            <span class="day-date">${dayInfo.formatted}</span>
                            ${dayInfo.hasEntries ? '<i class="fas fa-check-circle"></i>' : ''}
                        </div>
                    `;
                });
                
                this.elements.recentDaysList.innerHTML = html;
                
                // Adicionar eventos
                this.elements.recentDaysList.querySelectorAll('.recent-day').forEach(day => {
                    day.addEventListener('click', () => {
                        const date = new Date(day.dataset.date);
                        this.selectDate(date);
                    });
                });
            }

            // ========== FUNÇÕES DO EDITOR ==========
            async loadTodayEntry() {
                await this.loadEntryForDate(new Date());
            }

            async loadEntryForDate(date) {
                const dateKey = this.formatDateKey(date);
                const entry = await this.getEntryByDate(dateKey);
                
                if (this.elements.richEditor) {
                    this.elements.richEditor.innerHTML = entry?.content || '';
                }
                
                if (entry) {
                    this.renderChecklist(entry.checklist || []);
                    this.renderTags(entry.tags || []);
                    await this.loadAttachments(entry.id);
                } else {
                    this.renderChecklist([]);
                    this.renderTags([]);
                    this.clearAttachments();
                }
            }

            async saveCurrentEntry() {
                try {
                    const dateKey = this.formatDateKey(this.state.selectedDate);
                    const content = this.elements.richEditor?.innerHTML || '';
                    
                    const checklistItems = [];
                    this.elements.checklistItems?.querySelectorAll('.checklist-item').forEach(item => {
                        const checkbox = item.querySelector('input[type="checkbox"]');
                        const textElement = item.querySelector('.checklist-text');
                        
                        if (checkbox && textElement) {
                            checklistItems.push({
                                text: textElement.textContent,
                                completed: checkbox.checked
                            });
                        }
                    });
                    
                    const tags = [];
                    this.elements.tagsContainer?.querySelectorAll('.tag-text').forEach(tag => {
                        tags.push(tag.textContent.trim());
                    });
                    
                    const attachments = [];
                    this.elements.attachmentsGrid?.querySelectorAll('.attachment-item').forEach(item => {
                        if (item.dataset.id) {
                            attachments.push(item.dataset.id);
                        }
                    });
                    
                    const entry = {
                        id: dateKey,
                        date: dateKey,
                        content: content,
                        checklist: checklistItems,
                        tags: tags,
                        attachments: attachments,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    };
                    
                    await this.saveEntry(entry);
                    this.state.entries.set(entry.id, entry);
                    
                    tags.forEach(tag => this.state.tags.add(tag));
                    
                    this.renderCalendar();
                    this.loadRecentDays();
                    
                    this.showToast('Entrada salva com sucesso!', 'success');
                    
                    if (this.state.settings.autoBackup) {
                        setTimeout(() => this.createBackup(), 1000);
                    }
                    
                } catch (error) {
                    console.error('Erro ao salvar entrada:', error);
                    this.showToast('Erro ao salvar entrada', 'error');
                }
            }

            async autoSave() {
                if (!this.elements.richEditor || !this.elements.richEditor.innerHTML.trim()) return;
                
                try {
                    await this.saveCurrentEntry();
                    console.log('💾 Auto-save realizado');
                } catch (error) {
                    console.error('Erro no auto-save:', error);
                }
            }

            // ========== CHECKLIST ==========
            renderChecklist(items) {
                if (!this.elements.checklistItems) return;
                
                this.elements.checklistItems.innerHTML = '';
                
                items.forEach((item, index) => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'checklist-item';
                    itemElement.innerHTML = `
                        <input type="checkbox" ${item.completed ? 'checked' : ''}>
                        <span class="checklist-text ${item.completed ? 'completed' : ''}">${item.text}</span>
                        <button class="delete-checklist"><i class="fas fa-times"></i></button>
                    `;
                    
                    const checkbox = itemElement.querySelector('input[type="checkbox"]');
                    checkbox.addEventListener('change', () => {
                        item.completed = checkbox.checked;
                        itemElement.querySelector('.checklist-text').classList.toggle('completed', checkbox.checked);
                        this.autoSave();
                    });
                    
                    const deleteBtn = itemElement.querySelector('.delete-checklist');
                    deleteBtn.addEventListener('click', () => {
                        items.splice(index, 1);
                        this.renderChecklist(items);
                        this.autoSave();
                    });
                    
                    this.elements.checklistItems.appendChild(itemElement);
                });
            }

            addChecklistItem() {
                const input = this.elements.newChecklistItem;
                if (!input || !input.value.trim()) return;
                
                const items = [];
                this.elements.checklistItems?.querySelectorAll('.checklist-item').forEach(item => {
                    const checkbox = item.querySelector('input[type="checkbox"]');
                    const textElement = item.querySelector('.checklist-text');
                    if (checkbox && textElement) {
                        items.push({
                            text: textElement.textContent,
                            completed: checkbox.checked
                        });
                    }
                });
                
                items.push({
                    text: input.value.trim(),
                    completed: false
                });
                
                this.renderChecklist(items);
                input.value = '';
                this.autoSave();
            }

            showAddChecklistDialog() {
                const text = prompt('Digite o texto da tarefa:');
                if (text && text.trim()) {
                    const input = this.elements.newChecklistItem;
                    if (input) {
                        input.value = text;
                        this.addChecklistItem();
                    }
                }
            }

            // ========== TAGS ==========
            renderTags(tags) {
                if (!this.elements.tagsContainer) return;
                
                this.elements.tagsContainer.innerHTML = '';
                
                tags.forEach((tag, index) => {
                    const tagElement = document.createElement('span');
                    tagElement.className = 'tag';
                    tagElement.innerHTML = `
                        <span class="tag-text">${tag}</span>
                        <button class="delete-tag"><i class="fas fa-times"></i></button>
                    `;
                    
                    const deleteBtn = tagElement.querySelector('.delete-tag');
                    deleteBtn.addEventListener('click', () => {
                        tags.splice(index, 1);
                        this.renderTags(tags);
                        this.autoSave();
                    });
                    
                    this.elements.tagsContainer.appendChild(tagElement);
                });
            }

            showAddTagDialog() {
                const tag = prompt('Digite uma tag:');
                if (tag && tag.trim()) {
                    const tags = [];
                    this.elements.tagsContainer?.querySelectorAll('.tag-text').forEach(t => {
                        tags.push(t.textContent.trim());
                    });
                    
                    if (!tags.includes(tag.trim())) {
                        tags.push(tag.trim());
                        this.renderTags(tags);
                        this.autoSave();
                    }
                }
            }

            // ========== ANEXOS ==========
            async loadAttachments(entryId) {
                if (!this.elements.attachmentsGrid) return;
                
                const attachments = await this.getEntryAttachments(entryId);
                this.elements.attachmentsGrid.innerHTML = '';
                
                attachments.forEach(attachment => {
                    const element = this.createAttachmentElement(attachment);
                    this.elements.attachmentsGrid.appendChild(element);
                });
            }

            clearAttachments() {
                if (this.elements.attachmentsGrid) {
                    this.elements.attachmentsGrid.innerHTML = '';
                }
            }

            createAttachmentElement(attachment) {
                const element = document.createElement('div');
                element.className = 'attachment-item';
                element.dataset.id = attachment.id;
                
                const icon = this.getFileIcon(attachment.type);
                const size = this.formatFileSize(attachment.size);
                
                element.innerHTML = `
                    <div class="attachment-icon">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div class="attachment-info">
                        <span class="attachment-name">${attachment.name}</span>
                        <span class="attachment-size">${size}</span>
                    </div>
                    <button class="attachment-delete">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                
                element.addEventListener('click', (e) => {
                    if (!e.target.closest('.attachment-delete')) {
                        this.openAttachment(attachment);
                    }
                });
                
                const deleteBtn = element.querySelector('.attachment-delete');
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (confirm(`Excluir "${attachment.name}"?`)) {
                        await this.deleteAttachment(attachment.id);
                        element.remove();
                        this.autoSave();
                    }
                });
                
                return element;
            }

            attachFile() {
                if (this.elements.fileInput) {
                    this.elements.fileInput.click();
                }
            }

            async handleFileUpload(files) {
                for (let file of files) {
                    const reader = new FileReader();
                    
                    reader.onload = async (e) => {
                        const attachment = {
                            id: Date.now() + Math.random(),
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            data: e.target.result,
                            date: this.formatDateKey(this.state.selectedDate),
                            uploadedAt: new Date().toISOString()
                        };
                        
                        await this.saveAttachment(attachment);
                        
                        const element = this.createAttachmentElement(attachment);
                        if (this.elements.attachmentsGrid) {
                            this.elements.attachmentsGrid.appendChild(element);
                        }
                        
                        this.autoSave();
                        this.showToast(`Arquivo "${file.name}" anexado!`, 'success');
                    };
                    
                    reader.readAsDataURL(file);
                }
            }

            openAttachment(attachment) {
                if (attachment.type.startsWith('image/')) {
                    const img = new Image();
                    img.src = attachment.data;
                    img.onload = () => {
                        const w = window.open('');
                        w.document.write(`<img src="${attachment.data}" style="max-width: 100%;">`);
                    };
                } else {
                    const link = document.createElement('a');
                    link.href = attachment.data;
                    link.download = attachment.name;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }

            // ========== EXPORTAÇÃO PDF ==========
            async exportToPDF() {
                try {
                    this.showToast('Gerando PDF...', 'info');
                    
                    const dateKey = this.formatDateKey(this.state.selectedDate);
                    const entry = this.state.entries.get(dateKey);
                    
                    if (!entry) {
                        this.showToast('Nenhuma entrada para exportar', 'warning');
                        return;
                    }
                    
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({
                        orientation: 'portrait',
                        unit: 'mm',
                        format: 'a4'
                    });
                    
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    const margin = 15;
                    const quality = parseInt(this.state.settings.pdfQuality || 80);
                    const contentHeight = (pageHeight - (2 * margin)) * (quality / 100);
                    
                    // Cabeçalho
                    pdf.setFillColor(102, 126, 234);
                    pdf.roundedRect(margin, margin, pageWidth - (2 * margin), 25, 3, 3, 'F');
                    
                    pdf.setTextColor(255, 255, 255);
                    pdf.setFontSize(18);
                    pdf.setFont('helvetica', 'bold');
                    pdf.text('Agenda Organizacional', margin + 10, margin + 10);
                    
                    pdf.setFontSize(12);
                    pdf.setFont('helvetica', 'normal');
                    
                    const dateStr = this.state.selectedDate.toLocaleDateString('pt-BR', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    
                    pdf.text(dateStr, margin + 10, margin + 18);
                    
                    // Conteúdo
                    let yPosition = margin + 35;
                    
                    if (entry.tags && entry.tags.length > 0) {
                        pdf.setFontSize(10);
                        pdf.setTextColor(118, 75, 162);
                        pdf.text('Tags: ' + entry.tags.join(', '), margin, yPosition);
                        yPosition += 8;
                    }
                    
                    pdf.setFontSize(11);
                    pdf.setTextColor(0, 0, 0);
                    pdf.setFont('helvetica', 'normal');
                    
                    const content = this.cleanHTML(entry.content);
                    const lines = pdf.splitTextToSize(content, pageWidth - (2 * margin));
                    
                    for (let line of lines) {
                        if (yPosition > margin + contentHeight) {
                            pdf.addPage();
                            yPosition = margin;
                        }
                        pdf.text(line, margin, yPosition);
                        yPosition += 6;
                    }
                    
                    // Checklist
                    if (entry.checklist && entry.checklist.length > 0) {
                        yPosition += 10;
                        pdf.setFontSize(12);
                        pdf.setTextColor(102, 126, 234);
                        pdf.setFont('helvetica', 'bold');
                        pdf.text('Checklist:', margin, yPosition);
                        yPosition += 8;
                        
                        pdf.setFontSize(11);
                        pdf.setTextColor(0, 0, 0);
                        pdf.setFont('helvetica', 'normal');
                        
                        entry.checklist.forEach(item => {
                            const check = item.completed ? '✓' : '□';
                            const text = ` ${item.text}`;
                            
                            if (yPosition > margin + contentHeight) {
                                pdf.addPage();
                                yPosition = margin;
                            }
                            
                            pdf.text(check + text, margin + 5, yPosition);
                            yPosition += 6;
                        });
                    }
                    
                    // Rodapé
                    const totalPages = pdf.internal.getNumberOfPages();
                    for (let i = 1; i <= totalPages; i++) {
                        pdf.setPage(i);
                        pdf.setFontSize(9);
                        pdf.setTextColor(150, 150, 150);
                        pdf.text(
                            `Página ${i} de ${totalPages}`,
                            pageWidth - margin - 20,
                            pageHeight - margin + 5
                        );
                        
                        pdf.text(
                            `Exportado em: ${new Date().toLocaleDateString('pt-BR')}`,
                            margin,
                            pageHeight - margin + 5
                        );
                    }
                    
                    pdf.save(`agenda-${dateKey}.pdf`);
                    this.showToast('PDF exportado com sucesso!', 'success');
                    
                } catch (error) {
                    console.error('Erro ao exportar PDF:', error);
                    this.showToast('Erro ao exportar PDF', 'error');
                }
            }

            // ========== BACKUP ==========
            async createBackup() {
                try {
                    this.showToast('Criando backup...', 'info');
                    
                    const backup = {
                        id: Date.now(),
                        timestamp: new Date().toISOString(),
                        type: 'manual',
                        entries: Array.from(this.state.entries.values()),
                        settings: this.state.settings,
                        appVersion: '1.0.0'
                    };
                    
                    await this.saveBackup(backup);
                    await this.updateBackupHistory();
                    
                    this.showToast('Backup criado com sucesso!', 'success');
                    
                } catch (error) {
                    console.error('Erro ao criar backup:', error);
                    this.showToast('Erro ao criar backup', 'error');
                }
            }

            async updateBackupHistory() {
                if (!this.elements.backupHistory) return;
                
                const backups = await this.getBackups();
                backups.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                
                if (backups.length === 0) {
                    this.elements.backupHistory.innerHTML = '<p class="no-backups">Nenhum backup realizado</p>';
                    return;
                }
                
                let html = '';
                backups.slice(0, 5).forEach(backup => {
                    const date = new Date(backup.timestamp);
                    const dateStr = date.toLocaleDateString('pt-BR');
                    const timeStr = date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    
                    html += `
                        <div class="backup-history-item">
                            <div class="backup-info">
                                <span class="backup-date">${dateStr} ${timeStr}</span>
                                <span class="backup-size">${this.formatFileSize(JSON.stringify(backup).length)}</span>
                            </div>
                            <button class="restore-backup" data-id="${backup.id}">
                                <i class="fas fa-undo"></i>
                            </button>
                        </div>
                    `;
                });
                
                this.elements.backupHistory.innerHTML = html;
                
                this.elements.backupHistory.querySelectorAll('.restore-backup').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        const backupId = parseInt(e.currentTarget.dataset.id);
                        await this.restoreBackup(backupId);
                    });
                });
            }

            async restoreBackup(backupId) {
                if (!confirm('Restaurar este backup substituirá os dados atuais. Continuar?')) {
                    return;
                }
                
                try {
                    this.showToast('Restaurando backup...', 'info');
                    const backup = await this.getBackup(backupId);
                    
                    if (!backup) {
                        throw new Error('Backup não encontrado');
                    }
                    
                    // Limpar entradas atuais
                    this.state.entries.clear();
                    
                    // Restaurar entradas
                    if (backup.entries && Array.isArray(backup.entries)) {
                        for (const entry of backup.entries) {
                            await this.saveEntry(entry);
                            this.state.entries.set(entry.id, entry);
                        }
                    }
                    
                    // Restaurar configurações
                    if (backup.settings) {
                        this.state.settings = { ...this.state.settings, ...backup.settings };
                        this.saveSettings();
                        this.applyTheme(this.state.settings.theme);
                    }
                    
                    this.showToast('Backup restaurado com sucesso!', 'success');
                    setTimeout(() => window.location.reload(), 1000);
                    
                } catch (error) {
                    console.error('Erro ao restaurar backup:', error);
                    this.showToast('Erro ao restaurar backup', 'error');
                }
            }

            async exportToJSON() {
                try {
                    const data = {
                        exportedAt: new Date().toISOString(),
                        appVersion: '1.0.0',
                        entries: Array.from(this.state.entries.values()),
                        settings: this.state.settings,
                        stats: {
                            totalEntries: this.state.entries.size,
                            totalTags: this.state.tags.size
                        }
                    };
                    
                    const jsonStr = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `agenda-backup-${new Date().toISOString().split('T')[0]}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    URL.revokeObjectURL(url);
                    
                    this.showToast('Exportação JSON concluída!', 'success');
                    
                } catch (error) {
                    console.error('Erro ao exportar JSON:', error);
                    this.showToast('Erro ao exportar JSON', 'error');
                }
            }

            async exportToCSV() {
                try {
                    let csvContent = 'Data,Conteúdo,Tags,Checklist Concluído/Total,Anexos\n';
                    
                    const entries = Array.from(this.state.entries.values())
                        .sort((a, b) => a.date.localeCompare(b.date));
                    
                    for (const entry of entries) {
                        const content = this.cleanHTML(entry.content)
                            .replace(/,/g, ' ')
                            .replace(/\n/g, ' ')
                            .trim();
                        
                        const tags = entry.tags ? entry.tags.join('; ') : '';
                        
                        let checklistInfo = '0/0';
                        if (entry.checklist && entry.checklist.length > 0) {
                            const completed = entry.checklist.filter(item => item.completed).length;
                            checklistInfo = `${completed}/${entry.checklist.length}`;
                        }
                        
                        const attachments = entry.attachments ? entry.attachments.length : 0;
                        
                        csvContent += `"${entry.date}","${content}","${tags}","${checklistInfo}","${attachments}"\n`;
                    }
                    
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `agenda-export-${new Date().toISOString().split('T')[0]}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    URL.revokeObjectURL(url);
                    
                    this.showToast('Exportação CSV concluída!', 'success');
                    
                } catch (error) {
                    console.error('Erro ao exportar CSV:', error);
                    this.showToast('Erro ao exportar CSV', 'error');
                }
            }

            async importData() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json,.csv';
                
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    try {
                        const text = await file.text();
                        
                        if (file.name.endsWith('.json')) {
                            await this.importFromJSON(text);
                        } else if (file.name.endsWith('.csv')) {
                            await this.importFromCSV(text);
                        }
                        
                    } catch (error) {
                        console.error('Erro ao importar dados:', error);
                        this.showToast('Erro ao importar dados', 'error');
                    }
                };
                
                input.click();
            }

            async importFromJSON(jsonString) {
                const data = JSON.parse(jsonString);
                
                if (!data.entries || !Array.isArray(data.entries)) {
                    throw new Error('Formato de arquivo inválido');
                }
                
                if (!confirm(`Importar ${data.entries.length} entradas?`)) {
                    return;
                }
                
                this.showToast('Importando dados...', 'info');
                
                for (const entry of data.entries) {
                    await this.saveEntry(entry);
                    this.state.entries.set(entry.id, entry);
                }
                
                await this.loadTodayEntry();
                this.renderCalendar();
                
                this.showToast(`${data.entries.length} entradas importadas!`, 'success');
            }

            async importFromCSV(csvString) {
                const lines = csvString.split('\n');
                const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
                
                let importedCount = 0;
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    const values = this.parseCSVLine(line);
                    
                    if (values.length >= 1) {
                        const date = values[0].replace(/"/g, '');
                        const content = values[1] ? values[1].replace(/"/g, '') : '';
                        
                        const entry = {
                            id: date,
                            date: date,
                            content: content,
                            checklist: [],
                            tags: [],
                            attachments: [],
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        };
                        
                        await this.saveEntry(entry);
                        this.state.entries.set(entry.id, entry);
                        importedCount++;
                    }
                }
                
                this.showToast(`${importedCount} entradas importadas do CSV!`, 'success');
            }

            // ========== FUNÇÕES UTILITÁRIAS ==========
            formatDateKey(date) {
                const yyyy = date.getFullYear();
                const mm = String(date.getMonth() + 1).padStart(2, '0');
                const dd = String(date.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            }

            isSameDay(date1, date2) {
                return date1.getDate() === date2.getDate() &&
                       date1.getMonth() === date2.getMonth() &&
                       date1.getFullYear() === date2.getFullYear();
            }

            hasEntriesForDate(dateKey) {
                return this.state.entries.has(dateKey);
            }

            getDayName(dayIndex) {
                const dayNames = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
                return dayNames[dayIndex];
            }

            cleanHTML(html) {
                if (!html) return '';
                return html
                    .replace(/<br\s*\/?>/gi, '\n')
                    .replace(/<p>/gi, '\n')
                    .replace(/<\/p>/gi, '\n')
                    .replace(/<[^>]*>/g, '')
                    .replace(/&nbsp;/g, ' ')
                    .replace(/\n\s*\n\s*\n/g, '\n\n')
                    .trim();
            }

            getFileIcon(mimeType) {
                if (mimeType.startsWith('image/')) return 'fa-image';
                if (mimeType.includes('pdf')) return 'fa-file-pdf';
                if (mimeType.includes('word')) return 'fa-file-word';
                if (mimeType.includes('excel')) return 'fa-file-excel';
                if (mimeType.includes('powerpoint')) return 'fa-file-powerpoint';
                if (mimeType.includes('zip') || mimeType.includes('rar') || mimeType.includes('tar')) return 'fa-file-archive';
                if (mimeType.startsWith('text/')) return 'fa-file-alt';
                return 'fa-file';
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            parseCSVLine(line) {
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                
                values.push(current);
                return values;
            }

            showToast(message, type = 'info') {
                if (!this.elements.toastContainer) return;
                
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                
                toast.innerHTML = `
                    <i class="fas ${icons[type] || icons.info}"></i>
                    <span>${message}</span>
                `;
                
                this.elements.toastContainer.appendChild(toast);
                
                setTimeout(() => toast.classList.add('show'), 10);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            applyTheme(theme) {
                document.body.classList.remove('light-theme', 'dark-theme');
                document.body.classList.add(`${theme}-theme`);
                this.state.ui.theme = theme;
                this.state.settings.theme = theme;
                this.saveSettings();
                
                if (this.elements.themeToggle) {
                    const icon = this.elements.themeToggle.querySelector('i');
                    if (icon) {
                        icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                    }
                }
            }

            toggleSidebar() {
                if (!this.elements.sidebar) return;
                
                this.state.ui.sidebarOpen = !this.state.ui.sidebarOpen;
                this.elements.sidebar.classList.toggle('collapsed', !this.state.ui.sidebarOpen);
                
                const icon = this.elements.menuToggle?.querySelector('i');
                if (icon) {
                    icon.className = this.state.ui.sidebarOpen ? 'fas fa-bars' : 'fas fa-times';
                }
            }

            openSearch() {
                if (!this.elements.searchModal) return;
                
                this.elements.searchModal.classList.add('active');
                this.elements.searchInput?.focus();
                
                const closeModal = () => {
                    this.elements.searchModal.classList.remove('active');
                };
                
                this.elements.searchModal.querySelector('.close-modal')?.addEventListener('click', closeModal, { once: true });
                this.elements.searchModal.addEventListener('click', (e) => {
                    if (e.target === this.elements.searchModal) {
                        closeModal();
                    }
                }, { once: true });
                
                this.elements.searchInput?.addEventListener('input', async (e) => {
                    const query = e.target.value.trim();
                    if (query.length >= 2) {
                        await this.performSearch(query);
                    } else {
                        this.elements.searchResults.innerHTML = '';
                    }
                });
            }

            async performSearch(query) {
                if (!this.elements.searchResults) return;
                
                const results = [];
                const searchLower = query.toLowerCase();
                
                for (const [id, entry] of this.state.entries) {
                    if (entry.content.toLowerCase().includes(searchLower) ||
                        (entry.tags && entry.tags.some(tag => tag.toLowerCase().includes(searchLower))) ||
                        (entry.checklist && entry.checklist.some(item => item.text.toLowerCase().includes(searchLower)))) {
                        
                        const preview = this.cleanHTML(entry.content).substring(0, 150) + '...';
                        results.push({
                            date: entry.date,
                            preview: preview,
                            tags: entry.tags || []
                        });
                    }
                }
                
                this.displaySearchResults(results);
            }

            displaySearchResults(results) {
                if (!this.elements.searchResults) return;
                
                if (results.length === 0) {
                    this.elements.searchResults.innerHTML = '<p class="no-results">Nenhum resultado encontrado</p>';
                    return;
                }
                
                let html = '';
                results.forEach(result => {
                    const date = new Date(result.date);
                    const dateStr = date.toLocaleDateString('pt-BR');
                    
                    html += `
                        <div class="search-result" data-date="${result.date}">
                            <h4>${dateStr}</h4>
                            <p class="preview">${result.preview}</p>
                            ${result.tags.length > 0 ? `<div class="tags">${result.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
                        </div>
                    `;
                });
                
                this.elements.searchResults.innerHTML = html;
                
                this.elements.searchResults.querySelectorAll('.search-result').forEach(result => {
                    result.addEventListener('click', () => {
                        const date = new Date(result.dataset.date);
                        this.selectDate(date);
                        this.elements.searchModal.classList.remove('active');
                    });
                });
            }

            async updateStorageInfo() {
                if (!('storage' in navigator && 'estimate' in navigator.storage)) return;
                
                try {
                    const estimate = await navigator.storage.estimate();
                    const usedMB = (estimate.usage / (1024 * 1024)).toFixed(2);
                    const quotaMB = (estimate.quota / (1024 * 1024)).toFixed(2);
                    const percentage = Math.min(100, (estimate.usage / estimate.quota * 100)).toFixed(1);
                    
                    if (this.elements.storageText) {
                        this.elements.storageText.textContent = `${usedMB} MB usados de ${quotaMB} MB`;
                    }
                    
                    if (this.elements.storageProgress) {
                        this.elements.storageProgress.style.width = `${percentage}%`;
                    }
                    
                } catch (error) {
                    console.error('Erro ao obter informações de armazenamento:', error);
                }
            }

            loadSettings() {
                const defaults = {
                    theme: 'light',
                    autoBackup: true,
                    notifications: true,
                    pdfQuality: '80',
                    appVersion: '1.0.0'
                };
                
                try {
                    const saved = localStorage.getItem('agendaSettings');
                    if (saved) {
                        return { ...defaults, ...JSON.parse(saved) };
                    }
                } catch (error) {
                    console.error('Erro ao carregar configurações:', error);
                }
                
                return defaults;
            }

            saveSettings() {
                try {
                    localStorage.setItem('agendaSettings', JSON.stringify(this.state.settings));
                } catch (error) {
                    console.error('Erro ao salvar configurações:', error);
                }
            }

            // ========== FUNÇÕES DO BANCO DE DADOS ==========
            async getEntryByDate(dateKey) {
                return new Promise((resolve, reject) => {
                    const transaction = this.state.db.transaction(['entries'], 'readonly');
                    const store = transaction.objectStore('entries');
                    const request = store.get(dateKey);
                    
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async getEntriesByDateRange(startDate, endDate) {
                return new Promise((resolve, reject) => {
                    const transaction = this.state.db.transaction(['entries'], 'readonly');
                    const store = transaction.objectStore('entries');
                    const index = store.index('date');
                    const range = IDBKeyRange.bound(
                        this.formatDateKey(startDate),
                        this.formatDateKey(endDate)
                    );
                    const request = index.getAll(range);
                    
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async saveEntry(entry) {
                return new Promise((resolve, reject) => {
                    const transaction = this.state.db.transaction(['entries'], 'readwrite');
                    const store = transaction.objectStore('entries');
                    const request = store.put(entry);
                    
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async getEntryAttachments(entryId) {
                return new Promise((resolve, reject) => {
                    const transaction = this.state.db.transaction(['files'], 'readonly');
                    const store = transaction.objectStore('files');
                    const index = store.index('date');
                    const request = index.getAll(entryId);
                    
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async saveAttachment(attachment) {
                return new Promise((resolve, reject) => {
                    const transaction = this.state.db.transaction(['files'], 'readwrite');
                    const store = transaction.objectStore('files');
                    const request = store.add(attachment);
                    
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async deleteAttachment(attachmentId) {
                return new Promise((resolve, reject) => {
                    const transaction = this.state.db.transaction(['files'], 'readwrite');
                    const store = transaction.objectStore('files');
                    const request = store.delete(attachmentId);
                    
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async saveBackup(backup) {
                return new Promise((resolve, reject) => {
                    const transaction = this.state.db.transaction(['backups'], 'readwrite');
                    const store = transaction.objectStore('backups');
                    const request = store.add(backup);
                    
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async getBackups() {
                return new Promise((resolve, reject) => {
                    const transaction = this.state.db.transaction(['backups'], 'readonly');
                    const store = transaction.objectStore('backups');
                    const request = store.getAll();
                    
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }

            async getBackup(id) {
                return new Promise((resolve, reject) => {
                    const transaction = this.state.db.transaction(['backups'], 'readonly');
                    const store = transaction.objectStore('backups');
                    const request = store.get(id);
                    
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            // ========== SERVICE WORKER E PWA ==========
            async setupServiceWorker() {
                if ('serviceWorker' in navigator) {
                    try {
                        await navigator.serviceWorker.register('service-worker.js');
                        console.log('👷 Service Worker registrado');
                    } catch (error) {
                        console.error('❌ Falha ao registrar Service Worker:', error);
                    }
                }
            }

            setupPWAInstall() {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.deferredPrompt = e;
                    
                    if (this.elements.installPrompt) {
                        this.elements.installPrompt.style.display = 'flex';
                    }
                });
                
                this.elements.installBtn?.addEventListener('click', () => this.installPWA());
                this.elements.dismissInstall?.addEventListener('click', () => {
                    if (this.elements.installPrompt) {
                        this.elements.installPrompt.style.display = 'none';
                    }
                });
            }

            async installPWA() {
                if (!this.deferredPrompt) return;
                
                this.deferredPrompt.prompt();
                const { outcome } = await this.deferredPrompt.userChoice;
                
                if (outcome === 'accepted') {
                    console.log('📱 PWA instalado');
                    this.showToast('Aplicativo instalado com sucesso!', 'success');
                }
                
                if (this.elements.installPrompt) {
                    this.elements.installPrompt.style.display = 'none';
                }
                
                this.deferredPrompt = null;
            }
        }

        // ========== INICIALIZAÇÃO DA APLICAÇÃO ==========
        document.addEventListener('DOMContentLoaded', () => {
            window.agendaApp = new AgendaApp();
            
            // Atalhos de teclado
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    switch (e.key) {
                        case 's':
                            e.preventDefault();
                            window.agendaApp.saveCurrentEntry();
                            break;
                        case 'f':
                            e.preventDefault();
                            window.agendaApp.openSearch();
                            break;
                        case 'e':
                            e.preventDefault();
                            window.agendaApp.exportToPDF();
                            break;
                        case 'b':
                            e.preventDefault();
                            window.agendaApp.createBackup();
                            break;
                    }
                }
                
                if (e.key === 'Escape') {
                    const modals = document.querySelectorAll('.modal.active');
                    modals.forEach(modal => modal.classList.remove('active'));
                }
            });
            
            // Prevenir perda de dados
            window.addEventListener('beforeunload', (e) => {
                if (window.agendaApp && window.agendaApp.elements.richEditor?.innerHTML.trim()) {
                    e.preventDefault();
                    e.returnValue = 'Você tem alterações não salvas. Tem certeza que deseja sair?';
                    return e.returnValue;
                }
            });
        });
    </script>
